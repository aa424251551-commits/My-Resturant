<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alsaada Restaurant</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body data-title="signT">
<div id="hdr"></div>
<main class="auth">
  <div>
    <h1 data-i="signT"></h1>
    <div class="box">
      <h3 data-i="signH"></h3>
      <form data-form="signup" novalidate>
        <label for="fName" data-i="fn"></label>
        <input type="text" id="fName" name="fName" autocomplete="given-name"><div class="err"></div>
        <label for="sName" data-i="sn"></label>
        <input type="text" id="sName" name="sName" autocomplete="family-name"><div class="err"></div>
        <label for="email" data-i="email"></label>
        <input type="email" id="email" name="email" data-ph="phEmail" autocomplete="email"><div class="err"></div>
        <label for="password" data-i="password"></label>
        <input type="password" id="password" name="password" data-ph="phPass" autocomplete="new-password"><div class="err"></div>
        <label for="passwordd" data-i="confirm"></label>
        <input type="password" id="passwordd" name="passwordd" data-ph="phPass" autocomplete="new-password"><div class="err"></div>
        <button class="btn block" style="margin-top:20px" data-i="createBtn"></button>
        <div class="links2"><span><span data-i="haveAcc"></span> <a href="login.html" data-i="login"></a></span></div>
      </form>
    </div>
  </div>
</main>
<script src="JS/script.js"></script>
</body>
</html>
