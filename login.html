<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alsaada Restaurant</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body data-title="login">
<div id="hdr"></div>
<main class="auth">
  <div>
    <h1 data-i="loginT"></h1>
    <div class="box">
      <h3 data-i="loginH"></h3>
      <form data-form="login" novalidate>
        <label for="email" data-i="email"></label>
        <input type="email" id="email" name="email" data-ph="phEmail" autocomplete="email"><div class="err"></div>
        <label for="password" data-i="password"></label>
        <input type="password" id="password" name="password" data-ph="phPass" autocomplete="current-password"><div class="err"></div>
        <button class="btn block" style="margin-top:20px" data-i="login"></button>
        <div class="links2">
          <a href="#" data-i="forgot"></a>
          <a href="sigin.html" data-i="newAcc"></a>
        </div>
      </form>
    </div>
  </div>
</main>
<script src="JS/script.js"></script>
</body>
</html>
